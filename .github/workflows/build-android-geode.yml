name: Build Android Geode

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "geode-android/**"
      - ".github/workflows/build-android-geode.yml"

permissions:
  contents: write

jobs:
  build-android64:
    name: Build Frame-Guard for Android 64-bit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: geode-android
          target: Android64
          sdk: given
          build-config: Release

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$(find "${{ steps.build.outputs.build-output }}" -maxdepth 1 -type f -name '*.geode' -print -quit)"
          test -n "$PACKAGE"
          cp "$PACKAGE" Frame-Guard-Android64.geode

      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Guard-Android64-v0.12.0
          path: Frame-Guard-Android64.geode
          if-no-files-found: error
          retention-days: 14

      - name: Publish test build download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frame-guard-build-${{ github.run_number }}
          name: Frame-Guard Android64 build ${{ github.run_number }}
          body: |
            Automatically built Android64 .geode package from commit ${{ github.sha }}.
            This is an unverified development build; test it carefully and remove it if the game crashes or input behaves unexpectedly.
          prerelease: true
          make_latest: false
          files: Frame-Guard-Android64.geode

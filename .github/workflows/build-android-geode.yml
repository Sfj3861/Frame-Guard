name: Build Android Geode

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "geode-android/src/**"
      - "geode-android/tools/**"
      - "geode-android/mod.json"
      - "geode-android/CMakeLists.txt"
      - ".github/workflows/build-android-geode.yml"

permissions:
  contents: write

concurrency:
  group: frame-guard-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android64:
    name: Build Frame-Guard for Android 64-bit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate mod metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool geode-android/mod.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          mod = json.loads(Path("geode-android/mod.json").read_text(encoding="utf-8"))
          assert mod["id"] == "sfj3861.frame-guard", "Unexpected mod id"
          assert mod["gd"]["android"] == "2.2081", "Unexpected target Geometry Dash version"
          assert mod["geode"] == "5.11.2", "Unexpected Geode SDK version"
          assert mod["version"].startswith("v"), "Expected a v-prefixed version"
          assert "input-scheduler-enabled" in mod["settings"], "Missing scheduler setting"
          assert mod["settings"]["input-scheduler-enabled"]["default"] is False, "Experimental scheduler must stay disabled by default"
          print(f"Validated {mod['name']} {mod['version']} for GD {mod['gd']['android']}")
          PY

      - name: Validate source invariants
        shell: bash
        run: python3 geode-android/tools/validate_project.py

      - name: Build .geode package
        id: build
        uses: geode-sdk/build-geode-mod@a0f7676e6fcd1a584f6d0c1c800239008412defc # pinned main snapshot
        with:
          path: geode-android
          target: Android64
          sdk: given
          build-config: Release

      - name: Verify package
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          set -euo pipefail
          test -d "$BUILD_OUTPUT"
          mapfile -t packages < <(find "$BUILD_OUTPUT" -maxdepth 1 -type f -name '*.geode' -print | sort)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one .geode package in $BUILD_OUTPUT; found ${#packages[@]}" >&2
            find "$BUILD_OUTPUT" -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi
          cp "${packages[0]}" Frame-Guard-Android64.geode
          test -s Frame-Guard-Android64.geode
          unzip -t Frame-Guard-Android64.geode
          unzip -l Frame-Guard-Android64.geode | grep -q 'mod.json'
          unzip -l Frame-Guard-Android64.geode | grep -q 'sfj3861.frame-guard.android64.so'
          sha256sum Frame-Guard-Android64.geode | tee Frame-Guard-Android64.geode.sha256
          sha256sum -c Frame-Guard-Android64.geode.sha256
          MOD_VERSION="$(python3 -c 'import json; print(json.load(open("geode-android/mod.json"))["version"])')"
          MOD_HASH="$(cut -d ' ' -f1 Frame-Guard-Android64.geode.sha256)"
          {
            echo "## Frame-Guard Android64 package"
            echo "- Mod version: $MOD_VERSION"
            echo "- Target: Geometry Dash Android 2.2081 / Geode SDK 5.11.2"
            echo "- SHA-256: `$MOD_HASH`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .geode package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Frame-Guard-Android64-v0.13.10
          path: |
            Frame-Guard-Android64.geode
            Frame-Guard-Android64.geode.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish test build download
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: frame-guard-build-${{ github.run_number }}
          name: Frame-Guard Android64 build ${{ github.run_number }}
          body: |
            Automatically built Android64 .geode package from commit ${{ github.sha }}.
            Mod version: v0.13.10.
            This is an unverified development build. The experimental input scheduler is disabled by default.
            A successful package check is not a substitute for testing on Geometry Dash Android 2.2081.
          prerelease: true
          make_latest: false
          files: |
            Frame-Guard-Android64.geode
            Frame-Guard-Android64.geode.sha256
